name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install verified fixed toolchains
        shell: pwsh
        run: ./scripts/Prepare-Tools.ps1 -IncludeInstaller
      - name: Build, test and create source package
        shell: pwsh
        run: ./scripts/Build.ps1 -Installer -SourceArchive
      - name: Verify per-user install, version upgrade, uninstall and preserved state
        shell: pwsh
        run: ./scripts/Installer-Smoke.ps1
      - name: Keep review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EVEING-Lumiven-review-x64
          path: |
            artifacts/release/*
            artifacts/install-qa/result.json
            artifacts/qa/*-imports.json
          retention-days: 14
